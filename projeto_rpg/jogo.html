<!DOCTYPE html>
<html lang="pt">
<head>
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
</head>
<body style="background-color: white;">
     <div class="container">
        <div class="card text-center" style="color: white; background-color: yellow;
         background-size: cover; background-attachment: fixed; background-position: center;" >
        <div class="card-header" style="background-color: black; color: white;">RPG: Pible na batalha do riachuelo</div>
            <div class="row">
                <div class="col text-center" id="col-heroi">
                    <ul style="margin-top: 10px; border-radius: 2px; list-style: none;">
                       
                        <li id="nome-heroi" class="list-group-item" style="color: white; background-color: black;">Carvascon</li>
                        <li id="imagem-heroi" class="list-group-item"><img id="imagem-heroi" src="assets/pibble.jpg" height="200px" width="200px"></li>
                        <li id="hp-heroi" class="list-group-item"><img src="assets/escudo.png" height="25px" style="margin: 10px;"><progress id="hp-heroi" value="100" style="accent-color: red;"></progress></li>
                        <li id="mp-heroi" class="list-group-item"><img src="assets/espada.png" height="25px" style="margin: 10px;"><progress id="mp-heroi" value="100" style="accent-color: blue;"></progress><br></li>
                        <li id="especial" class="list-group-item"><img src="assets/especial.jpg" height="25px" style="margin: 10px;"><progress id="special" value="100" style="accent-color: yellow;"></progress></li>
                    </ul>
                </div>
                <div class="col text-center" id="col-boss" style="margin-right: 35px;">
                    <ul style="margin-top: 10px; border-radius: 2px; list-style: none;">
                        
                        <li id="nome-boss" class="list-group-item" style="color: white; background-color: black;">Milão Contra Carvas</li>
                        <li id="imagem-boss" class="list-group-item"><img src="assets/geeble.jpg" height="200px" width="200px"></li>
                        <li id="hp-boss" class="list-group-item"><img src="assets/escudo.png" height="25px" style="margin: 10px;"><progress id="hp-boss" value="1000" style="accent-color: red;"></progress><br></li>
                        <li id="raiva-boss" class="list-group-item"><img src="assets/raiva.jpg" height="25px" style="margin: 10px;"><progress id="raiva-boss" value="0" style="accent-color: #800080;"></progress></li>
                        <li id="status" class="list-group-item"><img src="assets/sigma.jpg" height="25px" width="25px" style="margin: 10px;"><progress id="aura-boss" value="1000" style="accent-color: cyan;"></progress></li>
                    </ul>
                </div>
            </div> 

                </div>
            </div>
        </div>
        <div class="card text-center" style="border-color: black; margin-left: 15px; margin-right: 15px;">
        <div class="card-header text-center" style="color: white; background-color: black;">TELA SUPORTE</div>
            <div class="row">
                <div class="col text-start" id="col-botoes">
                    <div class="btn-group" id="controles">
                    <ul>
                        <li class="list-group-item" style="background-color: rgb(255, 174, 1);"> <button class="btn btn-warning" style="margin: 5px;">ATTACK</button></li>
                        <li class="list-group-item" style="background-color: rgb(255, 174, 1);"><button class="btn btn-warning" style="margin: 5px;">SKILL</button></li>
                        <li class="list-group-item" style="background-color: rgb(255, 174, 1);"><button class="btn btn-warning" style="margin: 5px;">ESPECIAL</button></li>
                    </ul>
                    </div>
                </div>
                <div class="col text" id="col-status">
                    <h3>Status</h3>
                    <p>O inimigo aparece. Ele te encara com estranheza.</p>
                </div>
            </div>
    </div>
</body>
</html>
