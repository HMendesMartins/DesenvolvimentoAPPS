<!DOCTYPE html>
<html lang="pt">
<head>
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
</head>
<body style="background-color: white;">
     <div class="container">
        <div class="card text-center" style="color: white; background-color: yellow;
         background-size: cover; background-attachment: fixed; background-position: center;" >

        <div class="card-header" style="background-color: black; color: white;">RPG: Pible na batalha do riachuelo</div>
            <div class="row">
                <div class="col text-center" id="col-heroi">
                    <ul style="margin-top: 10px; border-radius: 2px; list-style: none;">
                       
                        <li class="list-group-item" style="color: white; background-color: black;">Carvascon</li>
                        <li class="list-group-item"><img id="imagem-heroi" src="assets/pibble.jpg" height="200px" width="200px"></li>
                        <li class="list-group-item"><img src="assets/escudo.png" height="25px" style="margin: 10px;"><progress id="hp-heroi" value="100" max="100"  style="accent-color: red;"></progress></li>
                        <li class="list-group-item"><img src="assets/espada.png" height="25px" style="margin: 10px;"><progress id="mp-heroi" value="100" max="100" style="accent-color: blue;"></progress><br></li>
                        <li class="list-group-item"><img src="assets/especial.jpg" height="25px" style="margin: 10px;"><progress id="especial-heroi" value="0" max="100" style="accent-color: yellow;"></progress></li>
                    </ul>
                </div>
                <div class="col text-center" id="col-boss" style="margin-right: 35px;">
                    <ul style="margin-top: 10px; border-radius: 2px; list-style: none;">
                        
                        <li class="list-group-item" style="color: white; background-color: black;">Milão Contra Carvas</li>
                        <li class="list-group-item"><img src="assets/geeble.jpg" height="200px" width="200px"></li>
                        <li class="list-group-item"><img src="assets/escudo.png" height="25px" style="margin: 10px;"><progress id="hp-boss" value="500" max="500" style="accent-color: red;"></progress><br></li>
                        <li class="list-group-item"><img src="assets/raiva.jpg" height="25px" style="margin: 10px;"><progress id="mp-boss" value="100" style="accent-color: #800080;"></progress></li>
                        <li class="list-group-item"><img src="assets/sigma.jpg" height="25px" width="25px" style="margin: 10px;"><progress id="especial-boss" value="100" max="100" style="accent-color: cyan;"></progress></li>
                    </ul>
                </div>
            </div> 
            <div class="row">
                <div class="col text-start" id="col-botoes" >
                    <div class="btn-group" id="controles" style="margin-left: 100px; display: flex; align-self: center;">
                       
                    </div>
                </div>
                <div class="col text-start" id="status" style="background-color: white; color: black; padding: 0px; margin: 25px; font-family: Arial, Helvetica, sans-serif;">
                    <div class="text-center" style="background-color: black; color: white;"><h1>STATUS</h1></div>
                    <div class="text-center" id="msg"><p>O inimigo aparece! Ele parece furioso!</p></div>
                </div>           
            </div>
            <script src="jogo.js"></script>
                </div>
            </div>
        </div>
        
    </div>
</body>
</html>
